name: Kubernetes Calculator CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: powershell
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "Docker Hub login failed" }
          
      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: pwsh
        run: |
          $image = "${env:DOCKERHUB_USERNAME}/k8s-practical:${env:GITHUB_SHA}"
          docker build -t $image .
          if ($LASTEXITCODE -ne 0) { throw "Docker build failed" }

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: pwsh
        run: |
          $image = "${env:DOCKERHUB_USERNAME}/k8s-practical:${env:GITHUB_SHA}"
          docker push $image
          if ($LASTEXITCODE -ne 0) { throw "Docker push failed" }

      - name: Deploy to Kubernetes
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: pwsh
        run: |
          $image = "${env:DOCKERHUB_USERNAME}/k8s-practical:${env:GITHUB_SHA}"

          kubectl apply -f k8s/deployment.yaml
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes manifest apply failed" }

          kubectl set image deployment/calculator-deployment calculator=$image
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes image update failed" }

          kubectl rollout status deployment/calculator-deployment --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes rollout failed" }

          kubectl get deployment calculator-deployment
          kubectl get pods
          kubectl get services
